name: Testes

# Tipos, unitários, build e Playwright a cada push. No branch padrão, se tudo passar,
# o app instalável (dist/web) vai para o GitHub Pages:
# https://rodrigo-bowie-tech.github.io/Organizador-de-concursos/
# (Settings > Pages > Source: GitHub Actions.)

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Tipos (TypeScript)
        run: npm run typecheck

      - name: Testes unitários (Vitest)
        run: npm test

      - name: Build (página do Artifact e app instalável)
        run: npm run build

      - name: Instalar o Chromium do Playwright
        run: npx playwright install --with-deps chromium

      - name: Testes de ponta a ponta (Playwright, celular, desktop e app instalável)
        run: npm run test:e2e

      - name: Guardar capturas e relatórios se falhar
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-playwright
          path: test-results/
          retention-days: 7

      - name: Guardar o app instalável para o GitHub Pages
        if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/web

  publicar:
    needs: testes
    if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.publicacao.outputs.page_url }}
    steps:
      - name: Publicar no GitHub Pages
        id: publicacao
        uses: actions/deploy-pages@v4
